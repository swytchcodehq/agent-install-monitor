name: Release on merge

on:
  push:
    branches: [main]

permissions:
  contents: write  # to push the tag
  actions: write   # to start release.yml

concurrency: release

# Releases whatever version pyproject.toml says, once. Bump the version in
# the PR itself (python3 scripts/bump_version.py patch); a merge that doesn't
# change it releases nothing. Nothing is pushed to main, which requires a
# reviewed PR, so a bot commit there would be rejected.
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag the version if it's new
        id: tag
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already tagged, nothing to release."
            exit 0
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # A tag pushed with the workflow's own token doesn't start other
      # workflows (GitHub's rule against loops), so the push above doesn't
      # trigger release.yml by itself. That's why v0.1.1 never reached PyPI.
      # Starting it directly is allowed.
      - name: Start the release
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref "${{ steps.tag.outputs.tag }}"
